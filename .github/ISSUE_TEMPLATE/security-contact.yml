name: Security contact request
description: Ask for a private channel when the Security tab has no "Report a vulnerability" button. Say nothing about the problem.
title: "Security contact request"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not describe the vulnerability or the evasion here, not even which
        part of the scanner it is in. If the [private advisory form](https://github.com/jtopaz1/aiterprise-aibom/security/advisories/new)
        opens for you, use it instead (SECURITY.md). A maintainer will reply here with a private channel.
  - type: checkboxes
    id: no-details
    attributes:
      label: Before you submit
      options:
        - label: This issue holds no detail of the problem.
          required: true
