name: publish-release

# Publish the GitHub Release of a tag from the files its release run already built and signed, for a
# run whose own github-release job did not run (v0.1.0: PyPI refused the upload, and that job then
# waited for PyPI). Nothing is rebuilt. Each file must match the run's SHA256SUMS and carry a Sigstore
# signature made by release.yml at that very tag before anything is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag, for example v0.1.0"
        required: true
      run-id:
        description: "The id of the release.yml run that built and signed the tag's files"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      actions: read     # read the release run and download its artifact
    steps:
      - name: The run is the tag's release run
        env:
          TAG: ${{ inputs.tag }}
          RUN: ${{ inputs.run-id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "not a run id: $RUN"; exit 1; }
          IFS=$'\t' read -r path branch event < <(gh api "repos/$REPO/actions/runs/$RUN" --jq '[.path, .head_branch, .event] | @tsv')
          echo "run $RUN: $path on $branch ($event)"
          if [ "$path" != ".github/workflows/release.yml" ] || [ "$branch" != "$TAG" ] || [ "$event" != "push" ]; then
            echo "run $RUN is not the release run of $TAG"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: signed
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - uses: sigstore/cosign-installer@v3
      - name: Every file matches SHA256SUMS and carries the release workflow's signature
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cd signed
          sha256sum -c SHA256SUMS
          for f in $(ls | grep -v '\.sigstore\.json$'); do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: signed/*
          generate_release_notes: true
