[build-system]
requires = ["setuptools>=77", "wheel"]  # 77: PEP 639 licence expression and license-files
build-backend = "setuptools.build_meta"

[project]
name = "aiterprise-scan"
dynamic = ["version"]
description = "AIterprise AIBOM Scanner: local-first AI supply-chain scanner that emits an AI-BOM and judges it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AIterprise" }]
keywords = ["aibom", "sbom", "cyclonedx", "mcp", "supply-chain", "security", "pickle", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies by design: the engine runs on the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/jtopaz1/aiterprise-aibom"
Documentation = "https://github.com/jtopaz1/aiterprise-aibom/blob/main/docs/index.md"
Source = "https://github.com/jtopaz1/aiterprise-aibom"
Issues = "https://github.com/jtopaz1/aiterprise-aibom/issues"
Security = "https://github.com/jtopaz1/aiterprise-aibom/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = []

[project.scripts]
aiterprise-scan = "aiterprise_scan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aiterprise_scan.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiterprise_scan = ["data/ait/*.json", "data/ait/*.json.gz"]
